---
layout: default
title: Nuotraukų galerija
---
<section class="section">
  <h1>Nuotraukų galerija</h1>
  {% assign nuotraukos = site.data.galerija.nuotraukos %}
  {% if nuotraukos.size > 0 %}
  <div class="gallery-grid">
    {% for photo in nuotraukos %}
    <figure class="gallery-item">
      <img src="{{ photo.nuotrauka | relative_url }}" alt="{{ photo.aprasymas }}" loading="lazy">
      {% if photo.aprasymas %}<figcaption>{{ photo.aprasymas }}</figcaption>{% endif %}
    </figure>
    {% endfor %}
  </div>
  {% else %}
  <p class="empty-note">Nuotraukų dar nėra.</p>
  {% endif %}
</section>
