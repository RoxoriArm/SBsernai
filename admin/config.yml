backend:
  name: github
  # SVARBU: pakeiskite žemiau į savo GitHub vartotojo vardą ir repozitorijos pavadinimą,
  # pvz. "jonas-petraitis/jonas-petraitis.github.io"
  repo: RoxoriArm/SBsernai
  branch: main

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:
  - name: "news"
    label: "Naujienos"
    label_singular: "Naujiena"
    folder: "_news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Pavadinimas", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime" }
      - { label: "Turinys", name: "body", widget: "markdown" }

  - name: "events"
    label: "Renginiai"
    label_singular: "Renginys"
    folder: "_events"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Pavadinimas", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime" }
      - { label: "Vieta", name: "vieta", widget: "string", required: false }
      - { label: "Aprašymas", name: "body", widget: "markdown" }

  - name: "tvarkarastis"
    label: "Tvarkaraščiai"
    files:
      - name: "grafikas"
        label: "Šiukšlių ir vandens grafikai"
        file: "_data/tvarkarastis.yml"
        fields:
          - { label: "Šiukšlių grafiko metai", name: "siuksliu_metai", widget: "string" }
          - label: "Šiukšlių grafiko pastabos"
            name: "siuksliu_pastabos"
            widget: "list"
            field: { label: "Pastaba", name: "pastaba", widget: "string" }
          - label: "Šiukšlių išvežimo mėnesiai"
            name: "siuksliu_menesiai"
            widget: "list"
            fields:
              - { label: "Mėnuo", name: "menuo", widget: "string" }
              - { label: "Mišrios rūšiuojamos (dienos)", name: "misrios", widget: "string", required: false }
              - { label: "Stiklas (dienos)", name: "stiklas", widget: "string", required: false }
              - { label: "Žaliosios (dienos)", name: "zaliosios", widget: "string", required: false }
          - label: "Vandens tiekimo pastabos"
            name: "vandens_pastabos"
            widget: "list"
            field: { label: "Pastaba", name: "pastaba", widget: "string" }
          - label: "Vandens tiekimo dienos"
            name: "vandens_dienos"
            widget: "list"
            fields:
              - { label: "Savaitės diena", name: "diena", widget: "string" }
              - { label: "Laikas", name: "laikas", widget: "string" }

  - name: "dokumentai"
    label: "Dokumentai"
    files:
      - name: "sarasas"
        label: "Dokumentų sąrašas"
        file: "_data/dokumentai.yml"
        fields:
          - label: "Dokumentai"
            name: "irasai"
            widget: "list"
            fields:
              - { label: "Pavadinimas", name: "pavadinimas", widget: "string" }
              - { label: "Aprašymas", name: "aprasymas", widget: "string", required: false }
              - label: "Failas (PDF)"
                name: "failas"
                widget: "file"
                media_folder: "/assets/documents"
                public_folder: "/assets/documents"

  - name: "kontaktai"
    label: "Kontaktai"
    files:
      - name: "duomenys"
        label: "Kontaktinė informacija"
        file: "_data/kontaktai.yml"
        fields:
          - { label: "Pirmininkas (vardas ir telefonas)", name: "pirmininkas", widget: "string" }
          - { label: "Buveinės adresas", name: "adresas", widget: "string" }
          - label: "Valdybos nariai"
            name: "valdyba"
            widget: "list"
            field: { label: "Vardas Pavardė", name: "narys", widget: "string" }
          - { label: "Buhalterės telefonas", name: "buhaltere_tel", widget: "string" }
          - { label: "Mokestinių lapų atsiėmimo info", name: "mokestiniai_lapai", widget: "text" }
          - { label: "Santechniko telefonas", name: "santechnikas_tel", widget: "string" }
          - { label: "Banko sąskaita", name: "banko_saskaita", widget: "string" }
          - { label: "Įmonės kodas", name: "imones_kodas", widget: "string" }
          - { label: "El. paštas", name: "epastas", widget: "string" }
          - { label: "Facebook nuoroda", name: "facebook", widget: "string" }
    label: "Nuotraukų galerija"
    files:
      - name: "nuotraukos"
        label: "Nuotraukos"
        file: "_data/galerija.yml"
        fields:
          - label: "Nuotraukos"
            name: "nuotraukos"
            widget: "list"
            fields:
              - { label: "Nuotrauka", name: "nuotrauka", widget: "image" }
              - { label: "Aprašymas", name: "aprasymas", widget: "string", required: false }
